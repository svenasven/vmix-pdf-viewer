name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: vMix-PDF-Viewer-Windows
          path: release/vMix-PDF-Viewer-*-Windows.exe
          if-no-files-found: error
